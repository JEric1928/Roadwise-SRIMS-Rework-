# Production profile.
# FRONTEND_URL must be set to the real deployed frontend origin, e.g.
#   FRONTEND_URL=https://roadwise-csjdm.com
frontend.url=${FRONTEND_URL}

# JWT_SECRET is intentionally not defaulted here. Startup fails if the
# environment variable is missing; see application.properties and JwtTokenProvider.

# Explicit dialect for production PostgreSQL on Supabase
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Production requires a shared broker. Without one, a revocation closes sockets only on the
# instance that handled the request, and a live update refreshes only the dashboards attached
# to the instance that published it.
#
# The bus is on by default and is what LavinMQ serves (AMQP 0-9-1). The STOMP relay is
# opt-in because it is a RabbitMQ plugin: enable it only against RabbitMQ with rabbitmq_stomp
# listening, in which case it carries live updates and the bus carries revocations.
roadwise.bus.enabled=${ROADWISE_BUS_ENABLED:true}
management.health.rabbit.enabled=${ROADWISE_BUS_ENABLED:true}
websocket.broker-relay.enabled=${WEBSOCKET_BROKER_RELAY_ENABLED:false}
# Read only when the relay is enabled.
websocket.broker-relay.host=${RABBITMQ_STOMP_HOST:${RABBITMQ_HOST:}}
