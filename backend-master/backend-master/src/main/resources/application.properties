spring.application.name=backend
server.port=8080
server.forward-headers-strategy=framework

# ==========================================
# ☁️ SUPABASE CLOUD DATABASE (Active)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# ==========================================
# 🗄️ SUPABASE OBJECT STORAGE
# ==========================================
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=road-reports
spring.flyway.repair-on-migrate=true

# No profile is activated by default. Local development must set
# SPRING_PROFILES_ACTIVE=dev; production must set SPRING_PROFILES_ACTIVE=prod
# (plus JWT_SECRET and FRONTEND_URL). This prevents a deployed instance from
# silently picking up the dev-only signing key in application-dev.properties.

# Actuator & Observability
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database Migrations (Flyway)
#
# repair-on-migrate is deliberately OFF. It realigns the checksums of migrations that
# were already applied, which is precisely how an edited or misapplied migration stops
# failing loudly and starts being accepted in silence. V6 was edited once after it had
# shipped (9076a16), so a database migrated before that commit needs one repair:
#
#   flyway -url=$DB_URL -user=$DB_USER -password=$DB_PASSWORD repair
#
# ...or a single release started with SPRING_FLYWAY_REPAIR_ON_MIGRATE=true. After that
# the recorded checksums match the files in this repository and startup validates them.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Consulted only when Flyway adopts a schema that already contains tables but has no
# flyway_schema_history. Baselining at 0 means "assume nothing was applied" and replay
# the chain from V1; V1 uses CREATE TABLE IF NOT EXISTS and V6/V12/V13 are re-runnable,
# so that replay is safe. A database that carries real history is never baselined at all,
# so this value does not affect an already-migrated deployment.
spring.flyway.baseline-version=0

# JWT Security Configuration
# No default is provided: production must set JWT_SECRET (a unique, high-entropy
# Base64 value) or startup fails. Dev/test profiles may supply their own value.
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ==========================================
# 🔐 MFA SECRET ENCRYPTION (TOTP)
# ==========================================
# AES-256-GCM key protecting TOTP shared secrets. Base64, exactly 32 bytes:
#   openssl rand -base64 32
# Leaving this unset does NOT stop the application: email-OTP MFA continues to work and
# only authenticator-app enrolment answers 503. That is deliberate, so enabling the
# feature is an explicit deployment decision rather than a silent fallback to an
# unencrypted secret. A malformed value IS fatal at startup, so a half-configured key
# can never look healthy.
mfa.encryption-key=${MFA_ENCRYPTION_KEY:}

# Increase maximum upload size for RoadWise image reports
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# 📧 TRANSACTIONAL EMAIL API (HTTPS / BREVO)
# ==========================================
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=csjdmroadwise@gmail.com
brevo.sender.name=RoadWise CSJDM

ai.service.url=${AI_SERVICE_URL:}
# Shared secret for service-to-service auth to the FastAPI /predict endpoint.
# The AI service is fail-closed (503) unless AI_SERVICE_API_KEY is configured there too.
ai.service.api-key=${AI_SERVICE_API_KEY:}

# ==========================================
# 🌐 CORS / FRONTEND ORIGIN CONFIGURATION
# ==========================================
frontend.url=${FRONTEND_URL:}

# ==========================================
# 🔑 PASSKEYS (WEBAUTHN)
# ==========================================
# Relying Party ID: the bare domain passkeys are scoped to -- no scheme, no port
# (e.g. roadwise.example.gov.ph; "localhost" for development). Leaving this unset does
# NOT stop the application: passkey endpoints answer 503 and the factor is never
# offered, mirroring mfa.encryption-key above. A malformed value IS fatal at startup,
# as is setting one of the two keys without the other.
webauthn.rp-id=${WEBAUTHN_RP_ID:}
# Comma-separated exact origins allowed to create and assert passkeys, e.g.
# https://roadwise.example.gov.ph. http:// is accepted on loopback hosts only.
webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:}

# ==========================================
# 🐇 RABBITMQ STOMP RELAY + REVOCATION FAN-OUT
# ==========================================
# Local/test runs retain the in-process simple broker. application-prod enables
# the relay by default; production must provide the RabbitMQ secrets below.
websocket.broker-relay.enabled=${WEBSOCKET_BROKER_RELAY_ENABLED:false}
websocket.broker-relay.host=${RABBITMQ_STOMP_HOST:${RABBITMQ_HOST:localhost}}
websocket.broker-relay.port=${RABBITMQ_STOMP_PORT:61613}
websocket.broker-relay.username=${RABBITMQ_USERNAME:}
websocket.broker-relay.password=${RABBITMQ_PASSWORD:}
websocket.broker-relay.virtual-host=${RABBITMQ_VHOST:/}

# AMQP uses the same RabbitMQ service for cross-instance session revocation.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
management.health.rabbit.enabled=${WEBSOCKET_BROKER_RELAY_ENABLED:false}
