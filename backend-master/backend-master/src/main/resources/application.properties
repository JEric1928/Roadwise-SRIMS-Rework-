spring.application.name=backend
server.port=8080

# ==========================================
# ☁️ SUPABASE CLOUD DATABASE (Active)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# 🗄️ SUPABASE OBJECT STORAGE
# ==========================================
supabase.url=${SUPABASE_URL:https://elojstmlgvgpvdtitqib.supabase.co}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=road-reports

spring.profiles.active=dev

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database Migrations (Flyway)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JWT Security Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# Increase maximum upload size for RoadWise image reports
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# 📧 TRANSACTIONAL EMAIL API (HTTPS / BREVO)
# ==========================================
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=csjdmroadwise@gmail.com
brevo.sender.name=RoadWise CSJDM

ai.service.url=${AI_SERVICE_URL:https://roadwise-ai-service-v2.onrender.com}

# ==========================================
# 🌐 CORS / FRONTEND ORIGIN CONFIGURATION
# ==========================================
frontend.url=${FRONTEND_URL:https://roadwise-csjdm.com}