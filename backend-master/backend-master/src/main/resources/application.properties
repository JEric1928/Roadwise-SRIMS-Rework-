spring.application.name=backend
server.port=8080
server.forward-headers-strategy=framework

# ==========================================
# ☁️ SUPABASE CLOUD DATABASE (Active)
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Settings
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.leak-detection-threshold=60000

# ==========================================
# 🗄️ SUPABASE OBJECT STORAGE
# ==========================================
supabase.url=${SUPABASE_URL:}
supabase.service-key=${SUPABASE_SERVICE_KEY:}
supabase.bucket-name=road-reports

# Out-of-order lets a migration whose version predates the last applied one still be
# applied, which is what lets a revision ship V20 to a database that has already moved
# past that number. Checksum validation stays ON: an edited migration must fail loudly
# rather than be repaired into silence (see the Flyway section below).
spring.flyway.out-of-order=true

# No profile is activated by default. Local development must set
# SPRING_PROFILES_ACTIVE=dev; production must set SPRING_PROFILES_ACTIVE=prod
# (plus JWT_SECRET and FRONTEND_URL). This prevents a deployed instance from
# silently picking up the dev-only signing key in application-dev.properties.

# Actuator & Observability
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=when-authorized

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Database Migrations (Flyway)
#
# Repair is OFF by default, and it realigns the checksums of migrations that were
# already applied — precisely how an edited or misapplied migration stops failing loudly
# and starts being accepted in silence. Editing a shipped migration is still sometimes
# unavoidable: 9076a16 edited V6, e792ff0 edited V3, V5 and V6 to make them replay-safe.
# A database migrated before such a commit then needs exactly one repair, because the
# checksums it recorded no longer match the files in this build:
#
#   Validate failed: Migrations have failed validation
#   Migration checksum mismatch for migration version 3
#   -> Applied to database : -2004172875
#   -> Resolved locally    : -990247389
#
# NOTE: spring.flyway.repair-on-migrate does NOT exist — Boot exposes no repair switch,
# so setting it was silently ignored and startup kept dying on the same mismatch. Use one
# of these instead:
#
#   1. start a single release with FLYWAY_REPAIR_ON_STARTUP=true, then remove the
#      variable (FlywayRepairConfig repairs once, then migrates as usual), or
#   2. flyway -url=$DB_URL -user=$DB_USERNAME -password=$DB_PASSWORD repair, or
#   3. fix the history rows directly, for a known pair of checksums:
#        UPDATE flyway_schema_history SET checksum = -990247389  WHERE version = '3';
#        UPDATE flyway_schema_history SET checksum = -1637609680 WHERE version = '5';
#      (those values are Flyway's CRC32 of the files as bundled in this build).
#
# After any of the three the recorded checksums match this repository and startup
# validates them normally — until the next shipped migration is edited.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Opt-in, off by default: repairs the schema history once (updating checksums of already
# applied migrations) before migrating. Set FLYWAY_REPAIR_ON_STARTUP=true for the single
# release that has to reconcile an edited migration with a deployed database.
roadwise.flyway.repair-on-startup=${FLYWAY_REPAIR_ON_STARTUP:false}

# Consulted only when Flyway adopts a schema that already contains tables but has no
# flyway_schema_history. Baselining at 0 means "assume nothing was applied" and replay
# the chain from V1; V1 uses CREATE TABLE IF NOT EXISTS and V6/V12/V13 are re-runnable,
# so that replay is safe. A database that carries real history is never baselined at all,
# so this value does not affect an already-migrated deployment.
spring.flyway.baseline-version=0

# JWT Security Configuration
# No default is provided: production must set JWT_SECRET (a unique, high-entropy
# Base64 value) or startup fails. Dev/test profiles may supply their own value.
jwt.secret=${JWT_SECRET:}
jwt.access-token-expiration-ms=900000
jwt.refresh-token-expiration-ms=604800000

# ==========================================
# 🔐 MFA SECRET ENCRYPTION (TOTP)
# ==========================================
# AES-256-GCM key protecting TOTP shared secrets. Base64, exactly 32 bytes:
#   openssl rand -base64 32
# Leaving this unset does NOT stop the application: email-OTP MFA continues to work and
# only authenticator-app enrolment answers 503. That is deliberate, so enabling the
# feature is an explicit deployment decision rather than a silent fallback to an
# unencrypted secret. A malformed value IS fatal at startup, so a half-configured key
# can never look healthy.
mfa.encryption-key=${MFA_ENCRYPTION_KEY:}

# Increase maximum upload size for RoadWise image reports
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ==========================================
# 📧 TRANSACTIONAL EMAIL API (HTTPS / BREVO)
# ==========================================
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=csjdmroadwise@gmail.com
brevo.sender.name=RoadWise CSJDM

ai.service.url=${AI_SERVICE_URL:}
# Shared secret for service-to-service auth to the FastAPI /predict endpoint.
# The AI service is fail-closed (503) unless AI_SERVICE_API_KEY is configured there too.
ai.service.api-key=${AI_SERVICE_API_KEY:}

# ==========================================
# 🌐 CORS / FRONTEND ORIGIN CONFIGURATION
# ==========================================
frontend.url=${FRONTEND_URL:}

# ==========================================
# 🔑 PASSKEYS (WEBAUTHN)
# ==========================================
# Relying Party ID: the bare domain passkeys are scoped to -- no scheme, no port
# (e.g. roadwise.example.gov.ph; "localhost" for development). Leaving this unset does
# NOT stop the application: passkey endpoints answer 503 and the factor is never
# offered, mirroring mfa.encryption-key above. A malformed value IS fatal at startup,
# as is setting one of the two keys without the other.
webauthn.rp-id=${WEBAUTHN_RP_ID:}
# Comma-separated exact origins allowed to create and assert passkeys, e.g.
# https://roadwise.example.gov.ph. http:// is accepted on loopback hosts only.
webauthn.allowed-origins=${WEBAUTHN_ALLOWED_ORIGINS:}

# ==========================================
# ==========================================
# 🐇 SHARED MESSAGE BROKER (LavinMQ or RabbitMQ)
# ==========================================
# One AMQP 0-9-1 service carries the two cross-instance signals:
#
#   * session revocation -- a logout or password reset handled by one instance has to
#     close that user's sockets on every instance;
#   * live updates -- a change handled by one instance has to refresh dashboards held
#     by every instance.
#
# AMQP 0-9-1 is what both LavinMQ and RabbitMQ speak, so RABBITMQ_* may point at either
# one; nothing in the application depends on which it is. LavinMQ is the smaller option
# and the reason the live-update fan-out is built on a fanout exchange (see
# LiveUpdateBusConfig) rather than on the STOMP relay below.
#
# Set ROADWISE_BUS_ENABLED=false only for a single-instance deployment: without the bus a
# revocation or a refresh reaches only the sockets attached to the instance that handled
# the request.
roadwise.bus.enabled=${ROADWISE_BUS_ENABLED:false}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_AMQP_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# STOMP relay -- RabbitMQ ONLY, and an alternative to the bus rather than an addition.
# It speaks STOMP 1.2 on the rabbitmq_stomp plugin's port, which LavinMQ does not
# implement, so leave it off against LavinMQ and let the bus carry live updates. When it
# is on it wins: the broker routes the published frame to every instance, so the bus is
# skipped rather than delivering each refresh twice (LiveUpdatePublisher decides this).
websocket.broker-relay.enabled=${WEBSOCKET_BROKER_RELAY_ENABLED:false}
websocket.broker-relay.host=${RABBITMQ_STOMP_HOST:${RABBITMQ_HOST:localhost}}
websocket.broker-relay.port=${RABBITMQ_STOMP_PORT:61613}
websocket.broker-relay.username=${RABBITMQ_USERNAME:}
websocket.broker-relay.password=${RABBITMQ_PASSWORD:}
websocket.broker-relay.virtual-host=${RABBITMQ_VHOST:/}

# The broker health indicator follows the bus: with ROADWISE_BUS_ENABLED=false there is
# no AMQP dependency worth reporting on.
management.health.rabbit.enabled=${ROADWISE_BUS_ENABLED:false}
